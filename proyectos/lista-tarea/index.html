<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Tareas · Organiza tu día</title>
<meta name="description" content="Lista de tareas moderna con prioridades, categorías, fechas de vencimiento y modo oscuro.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============ SPRITE DE ICONOS (oculto) ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon-sun" viewBox="0 0 24 24"><path d="M12 4V2M12 22v-2M4.93 4.93 3.51 3.51M20.49 20.49l-1.42-1.42M4 12H2M22 12h-2M4.93 19.07l-1.42 1.42M20.49 3.51l-1.42 1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 5.5 18 10.5" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m1 0-.7 12.1a2 2 0 0 1-2 1.9H9.7a2 2 0 0 1-2-1.9L7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="icon-flag" viewBox="0 0 24 24"><path d="M6 3v18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6 4c2-1.3 4-1.3 6 0s4 1.3 6 0v8c-2 1.3-4 1.3-6 0s-4-1.3-6 0V4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-inbox" viewBox="0 0 24 24"><path d="M4 13.5 6.3 5a1.5 1.5 0 0 1 1.44-1h8.52a1.5 1.5 0 0 1 1.44 1l2.3 8.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 13.5h4.8a.6.6 0 0 1 .55.35l.7 1.6a.6.6 0 0 0 .55.35h2.8a.6.6 0 0 0 .55-.35l.7-1.6a.6.6 0 0 1 .55-.35H20v5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="icon-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
    <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M7 8H4V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 8.5A7.5 7.5 0 1 1 4 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M11.5 4H6a2 2 0 0 0-2 2v5.5a2 2 0 0 0 .59 1.41l8.5 8.5a2 2 0 0 0 2.82 0l5.09-5.09a2 2 0 0 0 0-2.82l-8.5-8.5A2 2 0 0 0 11.5 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.4" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- ============ ENCABEZADO ============ -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24"><use href="#icon-check"/></svg></span>
      <div class="brand-text">
        <h1>Mis Tareas</h1>
        <p class="brand-tagline">Organiza tu día con claridad</p>
      </div>
    </div>
    <button id="themeToggle" class="icon-btn theme-toggle" type="button" aria-label="Cambiar a modo oscuro" aria-pressed="false" title="Cambiar tema">
      <svg width="19" height="19"><use href="#icon-moon"/></svg>
    </button>
  </header>

  <!-- ============ RESUMEN / PROGRESO ============ -->
  <section class="progress-card" aria-label="Resumen de progreso">
    <div class="progress-ring-wrap">
      <svg class="progress-ring" width="76" height="76" viewBox="0 0 76 76" aria-hidden="true">
        <circle class="progress-ring__track" cx="38" cy="38" r="32"/>
        <circle class="progress-ring__fill" id="progressRingFill" cx="38" cy="38" r="32"/>
      </svg>
      <span class="progress-ring__label" id="progressPercent">0%</span>
    </div>
    <div class="progress-stats">
      <div class="progress-message" id="progressMessage">Agrega tu primera tarea para comenzar</div>
      <dl class="stat-row">
        <div class="stat">
          <dt>Total</dt>
          <dd id="statTotal">0</dd>
        </div>
        <div class="stat">
          <dt>Pendientes</dt>
          <dd id="statPending">0</dd>
        </div>
        <div class="stat">
          <dt>Completadas</dt>
          <dd id="statCompleted">0</dd>
        </div>
      </dl>
    </div>
  </section>

  <!-- ============ BUSCADOR ============ -->
  <div class="search-bar">
    <svg width="17" height="17" aria-hidden="true"><use href="#icon-search"/></svg>
    <input type="search" id="searchInput" placeholder="Buscar por texto o categoría…" aria-label="Buscar tareas">
  </div>

  <!-- ============ FORMULARIO: AGREGAR TAREA ============ -->
  <form id="addForm" class="add-form" autocomplete="off">
    <div class="add-form__row">
      <input type="text" id="tareaInput" class="add-form__text" placeholder="Escribe una nueva tarea…" maxlength="140" aria-label="Texto de la nueva tarea" required>
      <button type="submit" class="btn btn--primary add-form__submit">
        <svg width="16" height="16"><use href="#icon-plus"/></svg>
        <span>Agregar</span>
      </button>
      <button type="button" id="toggleOptions" class="icon-btn add-form__toggle" aria-expanded="false" aria-controls="addFormOptions" title="Más opciones" aria-label="Mostrar más opciones">
        <svg width="18" height="18"><use href="#icon-chevron"/></svg>
      </button>
    </div>

    <div class="add-form__options" id="addFormOptions" hidden>
      <div class="field">
        <label for="categoriaInput">Categoría</label>
        <input type="text" id="categoriaInput" list="categoriasList" placeholder="p. ej. Trabajo" maxlength="24">
        <datalist id="categoriasList"></datalist>
      </div>
      <div class="field">
        <label for="prioridadInput">Prioridad</label>
        <select id="prioridadInput">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>
      <div class="field">
        <label for="fechaInput">Vencimiento</label>
        <input type="date" id="fechaInput">
      </div>
    </div>
  </form>

  <!-- ============ FILTROS ============ -->
  <div class="toolbar">
    <div class="filter-pills" role="tablist" aria-label="Filtrar tareas">
      <button class="pill is-active" data-filter="todas" role="tab" aria-selected="true">Todas <span class="pill-count" id="countTodas">0</span></button>
      <button class="pill" data-filter="pendientes" role="tab" aria-selected="false">Pendientes <span class="pill-count" id="countPendientes">0</span></button>
      <button class="pill" data-filter="completadas" role="tab" aria-selected="false">Completadas <span class="pill-count" id="countCompletadas">0</span></button>
    </div>
    <div class="sort-control">
      <label for="sortSelect">Ordenar</label>
      <select id="sortSelect">
        <option value="creacion">Más recientes</option>
        <option value="prioridad">Prioridad</option>
        <option value="vencimiento">Vencimiento</option>
        <option value="alfabetico">A–Z</option>
      </select>
    </div>
  </div>

  <!-- ============ LISTA DE TAREAS ============ -->
  <ul id="listaTareas" class="task-list"></ul>

  <!-- ============ ESTADO VACÍO ============ -->
  <div id="emptyState" class="empty-state" hidden>
    <svg width="40" height="40" aria-hidden="true"><use href="#icon-inbox"/></svg>
    <p class="empty-state__title" id="emptyTitle">Aún no tienes tareas</p>
    <p class="empty-state__subtitle" id="emptySubtitle">Agrega tu primera tarea desde el campo de arriba.</p>
  </div>

  <!-- ============ ACCIONES MASIVAS ============ -->
  <footer class="app-footer">
    <button id="limpiarCompletadasBtn" class="btn btn--ghost" type="button">
      <svg width="15" height="15"><use href="#icon-check"/></svg>
      Limpiar completadas
    </button>
    <button id="limpiarBtn" class="btn btn--danger-ghost" type="button">
      <svg width="15" height="15"><use href="#icon-trash"/></svg>
      Eliminar todas
    </button>
  </footer>

</div>

<!-- ============ CONTENEDOR DE NOTIFICACIONES ============ -->
<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/taskManager.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
